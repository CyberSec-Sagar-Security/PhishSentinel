name: PhishLens CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python 3.13, Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 src/ train.py app.py \
            --max-line-length=120 \
            --ignore=E501,W503,E203 \
            --exclude=__pycache__,.venv

      - name: Smoke test — verify core imports
        env:
          GEMINI_API_KEY: "test-key-not-real"
          VIRUSTOTAL_API_KEY: "test-key-not-real"
          GOOGLE_SAFE_BROWSING_API_KEY: "test-key-not-real"
          ABUSEIPDB_API_KEY: "test-key-not-real"
          URLSCAN_API_KEY: "test-key-not-real"
          IPQS_API_KEY: "test-key-not-real"
          OPENAI_API_KEY: "test-key-not-real"
        run: |
          python -c "
          from src.utils.config import DEFAULT_CONFIG
          from src.utils.logger import configure_logger, get_logger
          from src.ingestion.eml_parser import parse_eml_string, parse_eml_bytes, parse_msg_bytes
          from src.features.pipeline import FeaturePipeline
          from src.features.header_features import extract_header_features
          from src.features.url_features import extract_url_features
          from src.features.html_features import extract_html_features
          from src.features.text_features import extract_text_features
          from src.features.intelligence import ThreatIntelligence
          from src.detection.anomaly import AnomalyDetector
          from src.models.evaluator import PhishLensEvaluator
          from src.models.explainer import PhishLensExplainer
          print('All core imports OK')
          "

  security-scan:
    name: Security Scan (Bandit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Bandit
        run: pip install bandit[toml]

      - name: Run Bandit security scan
        run: |
          bandit -r src/ train.py \
            -ll \
            --skip B101,B311 \
            --format txt

  dependency-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies
        run: |
          pip install -r requirements.txt --quiet
          pip-audit --ignore-vuln PYSEC-2022-42969 || true
